packages:
  - "apps/*"
  - "packages/*"
# Installs and publishes resolve from npm (https://registry.npmjs.org/).
# Auth comes from the environment (NODE_AUTH_TOKEN) or a user-level .npmrc, never the repo.
registries:
  default: https://registry.npmjs.org/
  "@jsr": https://npm.jsr.io/
allowBuilds:
  "@biomejs/biome": true
  dtrace-provider: true
  esbuild: true
  protobufjs: true
peerDependencyRules:
  allowedVersions:
    "expo-modules-core>react-native-worklets": "0.12.x"
