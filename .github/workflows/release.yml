name: Publish

# Plain `npm publish` of one package directory. Nothing else is required:
# each package declares its own version, its real dependencies and publishConfig.access.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory to publish
        required: true
        default: packages/mobile-template
        type: choice
        options:
          - packages/mobile-template
          - packages/create-mobile-app

concurrency:
  group: publish-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # Packages publish to the public npm registry; override with the
          # NPM_REGISTRY_URL repository variable (e.g. a private mirror).
          registry-url: ${{ vars.NPM_REGISTRY_URL || 'https://registry.npmjs.org/' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:packages
      - run: pnpm publish:dry-run
      - name: npm publish
        working-directory: ${{ inputs.package }}
        run: npm publish --registry ${{ vars.NPM_REGISTRY_URL || 'https://registry.npmjs.org/' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}